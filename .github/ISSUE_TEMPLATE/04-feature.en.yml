name: Feature request (English)
description: Suggest a new feature or improvement.
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and submit in the affected project repository. Do not include credentials or private data. Do not report vulnerabilities publicly; follow the [security policy](https://github.com/xova-dev/.github/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this feature, and what problem do they face?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or outcome you need.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Approach and alternatives
      description: Optionally suggest an approach, alternatives or workarounds.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Evidence and constraints
      description: Add examples, screenshots, relevant links or constraints as needed.
    validations:
      required: false

name: Feature request (English)
description: Suggest a new feature or improvement.
type: Feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and submit in the affected project repository. Do not include credentials or private data. Do not report vulnerabilities publicly; follow the [security policy](https://github.com/xova-dev/.github/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this feature, and what problem do they face?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or outcome you need; an implementation design is not required.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested approach
      description: Describe an approach if you have one; otherwise leave this blank.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives considered or current workarounds.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots or relevant constraints without sensitive data.
    validations:
      required: false

name: Bug 报告（中文）
description: 报告异常行为或疑似缺陷。
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        请先搜索已有 Issue，并确认正在受影响项目的仓库中提交。不要包含凭据或私密数据。安全漏洞请勿公开提交，请查看 [安全政策](https://github.com/xova-dev/.github/blob/main/SECURITY.md)。
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与影响
      description: 描述异常行为及其影响。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤或触发条件
      description: 列出步骤和相关输入；暂时无法稳定复现时，请说明已知条件。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 项目版本 / commit
      description: 填写受影响版本或 commit；无法确定时请说明。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 按需提供操作系统、运行时、浏览器和相关配置，勿包含凭据。
    validations:
      required: false
  - type: input
    id: reproduction-link
    attributes:
      label: 最小复现链接
      description: 可选；无需公开私有代码，请先移除敏感数据。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 仅提供相关片段，移除 token、个人信息和其他敏感数据。
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 截图与补充信息
      description: 可附截图，或说明临时解决办法和其他线索。
    validations:
      required: false

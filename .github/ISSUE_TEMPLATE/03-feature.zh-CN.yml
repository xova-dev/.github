name: 功能建议（中文）
description: 提出新功能或改进建议。
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        请先搜索已有 Issue，并确认正在受影响项目的仓库中提交。不要包含凭据或私密数据。安全漏洞请勿公开提交，请查看 [安全政策](https://github.com/xova-dev/.github/blob/main/SECURITY.md)。
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 谁需要这个功能？目前遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望目标
      description: 描述希望实现的行为或结果。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 方案与替代办法
      description: 可填写实现思路、替代方案或临时解决办法。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 证据与约束
      description: 按需提供示例、截图、相关链接或限制。
    validations:
      required: false
